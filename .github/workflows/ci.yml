name: CI

on:
  push:
  pull_request:

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - name: Install root dependencies
        run: npm ci
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  # The serverless handlers in /api are Vercel entry points. Loading them here
  # catches a broken export or a bad require before the deployment fails at
  # runtime, when a real user hits the endpoint.
  serverless-handlers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Verify /api handlers export a callable handler
        run: node -e "for (const n of ['health','generate']) { const m = require('./api/'+n); if (typeof m !== 'function') { throw new Error(n + ' does not export a function'); } }"
